<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Uniwax</title>
<style>
*{margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#1a0b2e}
canvas{display:block;touch-action:none}
#nameWrap{position:fixed;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;background:rgba(10,6,24,.88);z-index:10}
#nameWrap.show{display:flex}
#nameBox{background:#fff;border-radius:16px;padding:24px;text-align:center;width:80%;max-width:360px}
#nameBox h2{margin-bottom:12px;color:#5a2a7a}
#name{width:100%;box-sizing:border-box;padding:10px;font-size:16px;border:2px solid #a45cff;border-radius:8px;outline:none;text-align:center}
#okBtn{margin-top:12px;padding:10px 26px;font-size:16px;border:none;border-radius:8px;background:#a45cff;color:#fff;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="nameWrap"><div id="nameBox"><h2>🌈 Uniwax</h2><input id="name" maxlength="12" placeholder="Your name"><br><button id="okBtn">Start</button></div></div>
<script src="zzfx_micro.js"></script>
<script src="zzfxm.js"></script>
<script src="audio.js"></script>
<script src="game.js"></script>
</body>
</html>
